name: Country Battle Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_MOBILE_VERSION: "18.20.4"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip jq curl binutils

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p _country_battle_source
          unzip -q "$ZIP_FILE" -d _country_battle_source

          SETTINGS_FILE=$(find _country_battle_source -name settings.gradle -type f | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$SETTINGS_FILE")" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Check Project Files
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          REQUIRED_FILES=(
            "settings.gradle"
            "build.gradle"
            "gradle.properties"
            "app/build.gradle"
            "app/CMakeLists.txt"
            "scripts/setup-node-mobile.sh"
            "scripts/setup-node-deps.sh"
            "app/src/main/assets/nodejs-project/package.json"
            "app/src/main/assets/nodejs-project/package-lock.json"
            "app/src/main/assets/nodejs-project/bootstrap.js"
            "app/src/main/assets/nodejs-project/server.js"
            "app/src/main/assets/nodejs-project/game/index.html"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi
          done

          echo "All project files found."

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found."
              exit 1
            fi
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install ARM64 Node.js Mobile Runtime
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          bash scripts/setup-node-mobile.sh

      - name: Install Node Dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          bash scripts/setup-node-deps.sh

      - name: Validate JavaScript
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          node --check app/src/main/assets/nodejs-project/server.js
          node --check app/src/main/assets/nodejs-project/bootstrap.js

      - name: Verify ARM64 Runtime
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -s app/libnode/bin/arm64-v8a/libnode.so
          test -s app/libnode/include/node/node.h

          readelf -h app/libnode/bin/arm64-v8a/libnode.so | grep "AArch64"

      - name: Build ARM64 APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Country-Battle-ARM64-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
